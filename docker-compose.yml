services:
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      HEALTEST_ENV: development
      HEALTEST_AUTH_MODE: local-token
      HEALTEST_API_TOKEN: ${HEALTEST_API_TOKEN:?Set HEALTEST_API_TOKEN in .env}
      DATABASE_URL: sqlite:///./data/healtest.db
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0"
      HEALTEST_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./benchmark:/app/benchmark:ro
      - ./sample_apps:/sample_apps:ro
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    profiles:
      - sandbox-worker
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    image: healtest-worker
    env_file: .env
    environment:
      HEALTEST_ENV: development
      HEALTEST_AUTH_MODE: local-token
      HEALTEST_API_TOKEN: ${HEALTEST_API_TOKEN:?Set HEALTEST_API_TOKEN in .env}
      DATABASE_URL: sqlite:////data/healtest.db
      REDIS_URL: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0"
      HEALTEST_DATA_DIR: /data
      HEALTEST_SANDBOX: docker
      HEALTEST_SANDBOX_IMAGE: ${HEALTEST_SANDBOX_IMAGE:-healtest-worker}
      HEALTEST_SANDBOX_NETWORK: ${HEALTEST_SANDBOX_NETWORK:-healtest-sandbox}
      HEALTEST_SANDBOX_ALLOWED_HOSTS: ${HEALTEST_SANDBOX_ALLOWED_HOSTS:-sample-apps}
      DOCKER_HOST: ${HEALTEST_SANDBOX_DOCKER_HOST:-tcp://127.0.0.1:2376}
      DOCKER_CONTEXT: ""
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /docker-certs
    volumes:
      - ./backend/data:/data
      - ./sample_apps:/sample_apps:ro
      - type: bind
        source: ${HEALTEST_DOCKER_CERT_PATH:-./docker-certs}
        target: /docker-certs
        read_only: true
    depends_on:
      - redis
      - api
      - sample-apps

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

  sample-apps:
    image: python:3.12-slim
    working_dir: /apps
    volumes:
      - ./sample_apps:/apps:ro
    command: python -m http.server 8901
    ports:
      - "127.0.0.1:8901:8901"
    networks:
      - default
      - sandbox

networks:
  sandbox:
    name: healtest-sandbox
    internal: true
